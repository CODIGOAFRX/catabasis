name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm test
      - run: npm run build
